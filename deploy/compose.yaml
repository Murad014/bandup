# BandUp on one server: PostgreSQL + the app + Caddy (HTTPS).
# On the server, in this folder:  docker compose up -d --build
# Only Caddy is reachable from the internet (ports 80 and 443).

name: bandup

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bandup
      POSTGRES_USER: bandup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandup -d bandup"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ..
    image: bandup:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      BANDUP_DB_URL: jdbc:postgresql://db:5432/bandup
      BANDUP_DB_USERNAME: bandup
      BANDUP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      BANDUP_JWT_SECRET: ${BANDUP_JWT_SECRET:?set BANDUP_JWT_SECRET in .env}
      BANDUP_ADMIN_EMAIL: ${BANDUP_ADMIN_EMAIL:?set BANDUP_ADMIN_EMAIL in .env}
      BANDUP_ADMIN_PASSWORD: ${BANDUP_ADMIN_PASSWORD:?set BANDUP_ADMIN_PASSWORD in .env}
    volumes:
      - media:/app/data/media
    # No "ports": only Caddy talks to the app, inside Docker's network.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BANDUP_DOMAIN: ${BANDUP_DOMAIN:?set BANDUP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  media:
  caddy-data:
  caddy-config:
