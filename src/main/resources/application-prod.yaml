# Production (SPRING_PROFILES_ACTIVE=prod), behind the Caddy proxy in deploy/.
# Every secret comes from the environment (deploy/.env on the server); nothing
# here has a usable default, so a missing value stops the start.
spring:
  datasource:
    url: ${BANDUP_DB_URL}
    username: ${BANDUP_DB_USERNAME}
    password: ${BANDUP_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  # Account emails over SMTP (any provider: Brevo, Resend, Mailgun…).
  mail:
    host: ${BANDUP_SMTP_HOST}
    port: ${BANDUP_SMTP_PORT:587}
    username: ${BANDUP_SMTP_USERNAME}
    password: ${BANDUP_SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080
  # Caddy terminates HTTPS and sends X-Forwarded-For / -Proto: the app sees the
  # real client address (login limits) and knows the request was HTTPS (HSTS).
  # Safe because only Caddy can reach the app (its port isn't published).
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml

bandup:
  jwt:
    secret: ${BANDUP_JWT_SECRET}
    require-secret: true
  auth:
    public-url: ${BANDUP_PUBLIC_URL}
    admin-email: ${BANDUP_ADMIN_EMAIL}
    admin-password: ${BANDUP_ADMIN_PASSWORD}
  media:
    dir: /app/data/media
  mail:
    enabled: true
    from: ${BANDUP_MAIL_FROM}

logging:
  level:
    root: INFO
