spring:
  application:
    name: bandup
  # Without SPRING_PROFILES_ACTIVE the app runs with the "local" profile
  # (application-local.yaml: the local admin login). Deployed environments set
  # their own profile, so the local defaults never apply there.
  profiles:
    default: local

  # Local dev defaults; override with env vars in any shared/deployed environment.
  datasource:
    url: ${BANDUP_DB_URL:jdbc:postgresql://localhost:5433/bandup}
    username: ${BANDUP_DB_USERNAME:admin}
    password: ${BANDUP_DB_PASSWORD:admin}

  # The schema is owned by Flyway migrations (src/main/resources/db/migration).
  # Hibernate only checks that entities match it; it never changes the schema.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

  # Cover image uploads (the app itself allows at most 3 MB).
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

# Access tokens (JWT, HS256). Set BANDUP_JWT_SECRET (at least 32 bytes) in every
# shared or deployed environment; never commit it. Left empty in local dev, a
# random key is generated at startup (tokens then don't survive a restart).
bandup:
  jwt:
    secret: ${BANDUP_JWT_SECRET:}
    issuer: bandup
    access-token-lifetime: 15m

  # Sign-in sessions. The first admin is created at startup from
  # BANDUP_ADMIN_EMAIL / BANDUP_ADMIN_PASSWORD when no admin exists (never commit them).
  auth:
    refresh-token-lifetime: 14d
    admin-email: ${BANDUP_ADMIN_EMAIL:}
    admin-password: ${BANDUP_ADMIN_PASSWORD:}
