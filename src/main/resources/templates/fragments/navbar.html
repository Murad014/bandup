<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Data-driven navbar. Renders one entry per NavItem:
   - enabled  -> real link (<a>), marked active when its key == activeKey
   - disabled -> non-interactive label, with a "soon" badge when comingSoon
  NavItem is a Java record, so Thymeleaf accesses components via method calls
  (item.key(), item.enabled(), ...).
-->
<nav class="app-nav" data-app-nav aria-label="Primary" th:fragment="navbar(navItems, activeKey)">
    <div class="app-nav__inner wrap">
        <a class="app-nav__brand" th:href="@{/}">
            <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
                <path d="M2 17 A15 5.6 0 0 1 32 17" transform="rotate(-24 17 17)" fill="none" stroke="var(--teal)" stroke-width="2.6" stroke-linecap="round"/>
                <circle cx="17" cy="17" r="10" fill="var(--accent)"/>
                <circle cx="13.6" cy="13.4" r="3.2" fill="#fff" opacity=".32"/>
                <path d="M2 17 A15 5.6 0 0 0 32 17" transform="rotate(-24 17 17)" fill="none" stroke="var(--teal)" stroke-width="2.6" stroke-linecap="round"/>
                <circle cx="29" cy="6.6" r="2.9" fill="var(--sun)"/>
            </svg>
            <span class="app-nav__name">Orbiko</span>
        </a>

        <button class="app-nav__toggle" type="button"
                data-nav-toggle aria-expanded="false" aria-controls="navMenu"
                aria-label="Toggle navigation">
            <span class="app-nav__bars" aria-hidden="true"></span>
        </button>

        <ul class="app-nav__menu" id="navMenu" data-nav-menu>
            <li th:each="item : ${navItems}" class="app-nav__item">
                <!-- Working link -->
                <a th:if="${item.enabled()}"
                   class="app-nav__link" data-nav-link
                   th:classappend="${item.key() == activeKey} ? ' is-active' : ''"
                   th:href="${item.href()}"
                   th:text="${item.label()}"
                   th:attr="aria-current=${item.key() == activeKey} ? 'page' : null">Reading</a>

                <!-- Planned / disabled feature -->
                <span th:unless="${item.enabled()}"
                      class="app-nav__link app-nav__link--disabled" aria-disabled="true">
                    <span th:text="${item.label()}">Grammar</span>
                    <span th:if="${item.comingSoon()}" class="app-nav__badge">soon</span>
                </span>
            </li>
            <!-- Account: filled in by account-nav.js from auth.js. -->
            <!-- "My progress": shown by account-nav.js to signed-in users only. -->
            <li class="app-nav__item" data-nav-progress hidden>
                <a class="app-nav__link" th:href="@{/progress}"
                   th:classappend="${activeKey == 'progress'} ? ' is-active' : ''"
                   th:attr="aria-current=${activeKey == 'progress'} ? 'page' : null">My progress</a>
            </li>
            <li class="app-nav__item" data-nav-signin>
                <a class="app-nav__link app-nav__cta" th:href="@{/login}">Sign in</a>
            </li>
            <li class="app-nav__item app-nav__account" data-nav-account hidden>
                <!-- Account button: avatar (first letter) + name; opens the account menu. -->
                <button class="account-chip" type="button" data-account-toggle
                        aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu">
                    <span class="avatar" data-nav-avatar aria-hidden="true"></span>
                    <span class="app-nav__user" data-nav-username></span>
                    <span class="account-chip__chev" aria-hidden="true"></span>
                </button>
                <div class="account-menu" id="accountMenu" role="menu" aria-label="Account" hidden>
                    <div class="account-menu__head">
                        <span class="avatar avatar--lg" data-nav-avatar aria-hidden="true"></span>
                        <div>
                            <strong data-nav-fullname></strong>
                            <small data-nav-role></small>
                        </div>
                    </div>
                    <a class="account-menu__item" role="menuitem" th:href="@{/progress}">My progress</a>
                    <button class="account-menu__item account-menu__signout" role="menuitem" type="button" data-nav-signout>Sign out</button>
                </div>
            </li>
            <li class="app-nav__item">
                <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme">
                    <span data-theme-icon aria-hidden="true">☾</span>
                </button>
            </li>
        </ul>
    </div>
</nav>
</body>
</html>
