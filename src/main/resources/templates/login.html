<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::#pageCss}, ~{::main})}">
<head>
    <title>Sign in · BandUp</title>
    <link id="pageCss" rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="wrap auth">
    <form class="auth-card" data-login-form novalidate>
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-error" data-form-error role="alert" hidden></p>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="auth-confirm" data-confirm-email hidden>
            <p>Please confirm your email first: open the link we sent you.</p>
            <button class="btn" type="button" data-resend>Send the link again</button>
            <p class="auth-ok" data-resent role="status" hidden>A new link is on its way (check spam too).</p>
        </div>
        <p class="auth-forgot"><a href="/forgot-password">Forgot password?</a></p>
        <button class="btn btn--primary auth-submit" type="submit">Sign in</button>
        <p class="auth-alt">New to BandUp? <a href="/register" data-keep-next>Create an account</a></p>
    </form>
    <!-- Inside <main>: the layout only takes this element. -->
    <script type="module" th:src="@{/js/login.js}"></script>
</main>
</body>
</html>
