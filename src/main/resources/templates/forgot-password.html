<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::#pageCss}, ~{::main})}">
<head>
    <title>Forgot password · Orbiko</title>
    <link id="pageCss" rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="wrap auth">
    <form class="auth-card" data-forgot-form novalidate>
        <h1 class="auth-title">Forgot your password?</h1>
        <p class="auth-sub">Enter your email and we'll send you a link to choose a new one.</p>
        <p class="auth-error" data-form-error role="alert" hidden></p>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <button class="btn btn--primary auth-submit" type="submit">Send reset link</button>
        <p class="auth-alt"><a href="/login">Back to sign in</a></p>
    </form>
    <section class="auth-card auth-done" data-forgot-done hidden>
        <div class="auth-done__icon" aria-hidden="true">✉️</div>
        <h1 class="auth-title">Check your email</h1>
        <p>If <b data-sent-to></b> has an Orbiko account, a reset link is on its way. It works for 1 hour.</p>
        <p class="auth-alt"><a href="/login">Back to sign in</a></p>
    </section>
    <script type="module" th:src="@{/js/account.js}"></script>
</main>
</body>
</html>
