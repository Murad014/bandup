<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::#pageCss}, ~{::main})}">
<head>
    <title>Choose a new password · Orbiko</title>
    <link id="pageCss" rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="wrap auth">
    <form class="auth-card" data-reset-form novalidate>
        <h1 class="auth-title">Choose a new password</h1>
        <p class="auth-error" data-form-error role="alert" hidden></p>
        <div class="field" data-field="password">
            <label for="password">New password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required
                   aria-describedby="passwordHint">
            <span class="hint" id="passwordHint">At least 10 characters. You'll be signed out on all devices.</span>
            <span class="err" data-error-for="password"></span>
        </div>
        <button class="btn btn--primary auth-submit" type="submit">Save new password</button>
    </form>
    <section class="auth-card auth-done" data-reset-done hidden>
        <div class="auth-done__icon" aria-hidden="true">✅</div>
        <h1 class="auth-title">Password changed</h1>
        <p>You can sign in with your new password now.</p>
        <a class="btn btn--primary auth-submit" href="/login">Sign in</a>
    </section>
    <script type="module" th:src="@{/js/account.js}"></script>
</main>
</body>
</html>
