<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::#pageCss}, ~{::main}, 'sessions')}">
<head>
    <title>Edit session · BandUp Admin</title>
    <link id="pageCss" rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<main id="editorRoot" th:attr="data-session-id=${sessionId}">
    <div class="editor-topbar">
        <div class="editor-topbar__title">
            <h1 class="admin-h1">Session editor</h1>
            <span id="statusBadge" class="badge badge--draft">draft</span>
            <span id="dirtyDot" class="dirty-dot" hidden title="Unsaved changes">●</span>
        </div>
        <div class="editor-actions">
            <button id="saveBtn" type="button" class="btn">Save draft</button>
            <button id="unpublishBtn" type="button" class="btn">Unpublish</button>
            <button id="publishBtn" type="button" class="btn btn--primary">Publish</button>
        </div>
    </div>

    <div id="editorErrors" class="admin-error" hidden></div>

    <div class="card">
        <h3>Metadata</h3>
        <div class="field"><label for="title">Title</label><input id="title" type="text"></div>
        <div class="field"><label for="stageLabel">Stage label</label><input id="stageLabel" type="text"></div>
        <div class="grid-2">
            <div class="field"><label for="durationSeconds">Duration (seconds)</label><input id="durationSeconds" type="number" min="1"></div>
            <div class="field"><label for="lowThresholdSeconds">Low-time threshold (seconds)</label><input id="lowThresholdSeconds" type="number" min="1"></div>
        </div>
    </div>

    <div class="card">
        <h3>Passage</h3>
        <div class="editor-split">
            <div>
                <div class="passage-toolbar">
                    <button id="glossBtn" type="button" class="btn">Add gloss</button>
                    <button id="evidenceBtn" type="button" class="btn">Mark evidence</button>
                    <button id="removeMarkBtn" type="button" class="btn">Remove mark</button>
                </div>
                <div id="passageEdit" class="passage-edit" contenteditable="true" aria-label="Passage editor"></div>
            </div>
            <div>
                <p class="admin-sub">Preview</p>
                <div id="passagePreview" class="passage-preview"></div>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>Questions</h3>
        <div id="groups"></div>
    </div>

    <datalist id="evidenceList"></datalist>

    <script type="module" th:src="@{/js/admin/editor-page.js}"></script>
</main>
</body>
</html>
