<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::#pageCss}, ~{::main})}">
<head>
    <title>Create an account · BandUp</title>
    <link id="pageCss" rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="wrap auth">
    <form class="auth-card" data-register-form novalidate>
        <h1 class="auth-title">Create an account</h1>
        <p class="auth-error" data-form-error role="alert" hidden></p>
        <div class="field" data-field="displayName">
            <label for="displayName">Your name</label>
            <input id="displayName" name="displayName" type="text" autocomplete="name" maxlength="80">
            <span class="err" data-error-for="displayName"></span>
        </div>
        <div class="field" data-field="email">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <span class="err" data-error-for="email"></span>
        </div>
        <div class="field" data-field="password">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required
                   aria-describedby="passwordHint">
            <span class="hint" id="passwordHint">At least 10 characters.</span>
            <span class="err" data-error-for="password"></span>
        </div>
        <div class="field" data-field="supportLanguage">
            <label for="supportLanguage">Help language (word meanings and explanations)</label>
            <!-- The enabled support languages (database seed: az, en). -->
            <select id="supportLanguage" name="supportLanguage">
                <option value="az">Azərbaycanca</option>
                <option value="en">English</option>
            </select>
            <span class="err" data-error-for="supportLanguage"></span>
        </div>
        <button class="btn btn--primary auth-submit" type="submit">Create account</button>
        <p class="auth-alt">Already have an account? <a href="/login" data-keep-next>Sign in</a></p>
    </form>
    <!-- Inside <main>: the layout only takes this element. -->
    <script type="module" th:src="@{/js/register.js}"></script>
</main>
</body>
</html>
