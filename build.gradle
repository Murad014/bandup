plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bandup'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-mail'   // account emails over SMTP (requirement 12)
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.jsoup:jsoup:1.21.1'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
	testImplementation 'org.seleniumhq.selenium:selenium-java'   // version managed by Spring Boot
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'ui'   // the visible Selenium scenarios run with: sh gradlew uiTest
	}
	systemProperty 'spring.profiles.active', 'test'   // not "local": tests set up their own accounts
	systemProperty 'bandup.media.dir', layout.buildDirectory.dir('test-media').get().asFile.path
}

// Selenium UI scenarios in a visible Chrome (slowed down, steps highlighted).
//   sh gradlew uiTest                 watch them run
//   sh gradlew uiTest -Pheadless      same tests, no window
// Screenshots of every step: build/ui-screenshots/; report: build/reports/tests/uiTest/
tasks.register('uiTest', Test) {
	description = 'Runs the Selenium UI scenarios in Chrome.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'ui'
	}
	systemProperty 'spring.profiles.active', 'test'
	systemProperty 'bandup.media.dir', layout.buildDirectory.dir('test-media').get().asFile.path
	systemProperty 'ui.headless', project.hasProperty('headless')
	systemProperty 'ui.slowMs', project.findProperty('slowMs') ?: '700'
	outputs.upToDateWhen { false }
	testLogging {
		events 'started', 'passed', 'failed'
	}
}
